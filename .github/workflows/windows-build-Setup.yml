name: 构建 Windows EXE 安装包

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  FLUTTER_VERSION: beta
  FLUTTER_CHANNEL: beta
  RUST_VERSION: stable

jobs:
  build:
    name: Windows x64 安装包
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $env:RUST_VERSION

      - name: 安装 Flutter
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\install_flutter.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装打包工具和 Protobuf 编译器
        run: |
          choco install innosetup protoc --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 准备 Npcap SDK
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $sdkDir = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $sdkDir -Force
          $libDir = Join-Path $sdkDir "Lib\x64"
          foreach ($library in @("Packet.lib", "wpcap.lib")) {
            if (-not (Test-Path -LiteralPath (Join-Path $libDir $library))) {
              throw "Npcap SDK 缺少 $library"
            }
          }
          "LIB=$libDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPCAP_SDK_LIB=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 获取 Flutter 依赖
        run: |
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter pub get

      - name: 编译 Windows 应用
        run: flutter build windows --release --no-pub

      - name: 复制运行时文件
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "build\windows\x64\runner\Release"
          if (-not (Test-Path -LiteralPath (Join-Path $releaseDir "astral.exe"))) {
            throw "未找到编译产物 astral.exe"
          }
          Copy-Item -Path @("$env:GITHUB_WORKSPACE\dlls\*.dll", "$env:GITHUB_WORKSPACE\dlls\*.sys") -Destination $releaseDir -Force

      - name: 生成 EXE 安装包
        run: |
          $versionMatch = Select-String -LiteralPath "$env:GITHUB_WORKSPACE\pubspec.yaml" -Pattern '^version:\s*(\d+\.\d+\.\d+)' | Select-Object -First 1
          if (-not $versionMatch) { throw "无法读取应用版本号" }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw "未找到 Inno Setup 编译器" }
          & $compiler "/DMyAppVersion=$version" "$env:GITHUB_WORKSPACE\installer\astral.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "$env:GITHUB_WORKSPACE\Output\astral-windows-x64-setup.exe")) {
            throw "未生成 EXE 安装包"
          }

      - name: 上传 EXE 安装包
        uses: actions/upload-artifact@v4
        with:
          name: astral-windows-x64-setup
          path: Output/astral-windows-x64-setup.exe
          if-no-files-found: error
